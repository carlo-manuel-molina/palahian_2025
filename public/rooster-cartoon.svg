<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#fef3c7"/>
  
  <!-- Rooster Body -->
  <ellipse cx="100" cy="120" rx="35" ry="25" fill="#dc2626"/>
  
  <!-- Head -->
  <circle cx="100" cy="85" r="20" fill="#dc2626"/>
  
  <!-- Beak -->
  <polygon points="85,85 75,80 85,90" fill="#f59e0b"/>
  
  <!-- Eye -->
  <circle cx="95" cy="80" r="3" fill="#1f2937"/>
  <circle cx="95" cy="80" r="1" fill="#ffffff"/>
  
  <!-- Comb -->
  <path d="M 80 70 Q 100 60 120 70 Q 115 65 110 70 Q 105 65 100 70 Q 95 65 90 70 Q 85 65 80 70" fill="#dc2626"/>
  
  <!-- Wattle -->
  <ellipse cx="85" cy="95" rx="3" ry="5" fill="#dc2626"/>
  <ellipse cx="115" cy="95" rx="3" ry="5" fill="#dc2626"/>
  
  <!-- Tail Feathers -->
  <path d="M 130 110 Q 150 100 145 120 Q 140 115 135 120 Q 130 115 125 120" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <path d="M 130 115 Q 150 105 145 125 Q 140 120 135 125 Q 130 120 125 125" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <path d="M 130 120 Q 150 110 145 130 Q 140 125 135 130 Q 130 125 125 130" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  
  <!-- Legs -->
  <line x1="90" y1="145" x2="90" y2="160" stroke="#1f2937" stroke-width="3"/>
  <line x1="110" y1="145" x2="110" y2="160" stroke="#1f2937" stroke-width="3"/>
  
  <!-- Feet -->
  <path d="M 85 160 L 95 160 L 90 165" stroke="#1f2937" stroke-width="2" fill="none"/>
  <path d="M 105 160 L 115 160 L 110 165" stroke="#1f2937" stroke-width="2" fill="none"/>
  
  <!-- Wing -->
  <ellipse cx="85" cy="115" rx="12" ry="8" fill="#b91c1c"/>
</svg> 