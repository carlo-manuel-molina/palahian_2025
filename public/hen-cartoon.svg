<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#fef3c7"/>
  
  <!-- Hen Body -->
  <ellipse cx="100" cy="120" rx="35" ry="25" fill="#f59e0b"/>
  
  <!-- Head -->
  <circle cx="100" cy="85" r="20" fill="#f59e0b"/>
  
  <!-- Beak -->
  <polygon points="85,85 75,80 85,90" fill="#d97706"/>
  
  <!-- Eye -->
  <circle cx="95" cy="80" r="3" fill="#1f2937"/>
  <circle cx="95" cy="80" r="1" fill="#ffffff"/>
  
  <!-- Small Comb -->
  <path d="M 85 70 Q 100 65 115 70" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Wattle -->
  <ellipse cx="85" cy="95" rx="3" ry="5" fill="#dc2626"/>
  <ellipse cx="115" cy="95" rx="3" ry="5" fill="#dc2626"/>
  
  <!-- Tail Feathers (smaller than rooster) -->
  <path d="M 130 110 Q 145 105 140 120 Q 135 115 130 120" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <path d="M 130 115 Q 145 110 140 125 Q 135 120 130 125" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  
  <!-- Legs -->
  <line x1="90" y1="145" x2="90" y2="160" stroke="#1f2937" stroke-width="3"/>
  <line x1="110" y1="145" x2="110" y2="160" stroke="#1f2937" stroke-width="3"/>
  
  <!-- Feet -->
  <path d="M 85 160 L 95 160 L 90 165" stroke="#1f2937" stroke-width="2" fill="none"/>
  <path d="M 105 160 L 115 160 L 110 165" stroke="#1f2937" stroke-width="2" fill="none"/>
  
  <!-- Wing -->
  <ellipse cx="85" cy="115" rx="12" ry="8" fill="#d97706"/>
  
  <!-- Egg (optional detail) -->
  <ellipse cx="70" cy="140" rx="8" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
</svg> 